[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wake-codex"
version = "0.1.0"
description = "Poll an external trigger and queue a message to a Codex thread"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
wake-codex = "wake_codex.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
